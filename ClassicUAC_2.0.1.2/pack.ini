[Pack]
Name = Classic UserAccountControl DirectUI Concent Dialogs
Author = ImSwordQueen | Travy-Patty | EliteSoftware Tech Co.
Version = 2.0.1.2
Preview = preview.png
Readme = README
MinBuild = 6
MaxBuild = 2199005

[Options.Variant]
Name = UAC Concent Dialog Variation
DefaultValue = 0
0 = Windows Vista (NT 6.0)
1 = Windows 7 (NT 6.1)
2 = Windows 8 (NT 6.2 / 6.3)
3 = Windows Vista (Nt 6.0) Teal-Banner 4 Trusted (No More Grey Banner!)

; Apply Entries
[Registry]
TrustedInstaller = 1
0 = registry\entries.reg

; Windows Vista
[Files]
Requires = Variant=0
%SystemRoot%\System32\authuac.dll = resources\variants\vista\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\vista\authuac.dll.mui

; Windows 7
[Files]
Requires = Variant=1
%SystemRoot%\System32\authuac.dll = resources\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\seven\authuac.dll.mui

; Windows 8
[Files]
Requires = Variant=2
%SystemRoot%\System32\authuac.dll = resources\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\eight\authuac.dll.mui

; Windows Vista (Teal)
[Files]
Requires = Variant=3
%SystemRoot%\System32\authuac.dll = resources\variants\vista_teal\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\vista_teal\authuac.dll.mui

[Files]
%SystemRoot%\System32\consent.exe = resources\consent.exe
%SystemRoot%\System32\wincredui.dll = resources\wincredui.dll