[Pack]
Name = Win7 Network Flyout (Ultra-Minimal)
Author = kfh83 (Forked by Gemini CLI)
Version = 1.0.2
Preview = preview.png
Readme = README
MaxBuild = 1904005
MinBuild = 6200

[Options.VAN]
Name = Network Flyout
DefaultValue = 1

[Registry]
Requires = VAN=1
0 = registry\normal.reg

[Registry]
Requires = VAN=1
TrustedInstaller = 1
0 = registry\trustedinstaller.reg

[Files]
; Core UI Dependencies
%SystemRoot%\System32\dui77.dll = files\dui77.dll
%SystemRoot%\System32\en-US\dui77.dll.mui = files\en-US\dui77.dll.mui

; The Flyout itself
%SystemRoot%\System32\VAN.dll = files\VAN.dll
%SystemRoot%\System32\en-US\VAN.dll.mui = files\en-US\VAN.dll.mui

; Utility Dependency
%SystemRoot%\System32\QUTIL.dll = files\QUTIL.dll
%SystemRoot%\System32\en-US\QUTIL.dll.mui = files\en-US\Qutil.dll.mui
