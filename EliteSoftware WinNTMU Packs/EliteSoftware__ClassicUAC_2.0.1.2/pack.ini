[Pack]
Name = Classic UserAccountControl DirectUI Concent Dialogs +Plus
Author = ImSwordQueen | Travy-Patty | EliteSoftware Tech Co.
Version = 2.0.1.2
Preview = preview.png
Readme = README.txt
MinBuild = 6
MaxBuild = 2199005

[Options.Variant]
Name = UAC Concent Dialog Variation
DefaultValue = 1
0 = Windows Vista (NT 6.0)
1 = Windows Vista Teal Banners (No More Grey Banner!)
2 = Windows 7 (NT 6.1)
3 = Windows 8/8.1/10 (NT 6.2 / 6.3 / 10.0) 

[Options.Files]
Name = Apply Shell32 / Imageres MUN Resources 
DefaultValue = 0

; Apply Entries
[Registry]
TrustedInstaller = 1
0 = registry\entries.reg

; Windows Vista
[Files]
Requires = Variant=0
%SystemRoot%\System32\authuac.dll = resources\variants\vista\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\vista\authuac.dll.mui

; Windows Vista (Teal)
[Files]
Requires = Variant=1
%SystemRoot%\System32\authuac.dll = resources\variants\vista_teal\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\vista_teal\authuac.dll.mui

; Windows 7
[Files]
Requires = Variant=2
%SystemRoot%\System32\authuac.dll = resources\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\seven\authuac.dll.mui

; Windows 8/8.1
[Files]
Requires = Variant=3
%SystemRoot%\System32\authuac.dll = resources\authuac.dll
%SystemRoot%\System32\en-US\authuac.dll.mui = resources\variants\eight\authuac.dll.mui

[Files]
%SystemRoot%\System32\consent.exe = resources\consent.exe
%SystemRoot%\System32\wincredui.dll = resources\wincredui.dll
%SystemRoot%\System32\UIRibbon.dll = System32\UIRibbon.dll
%SystemRoot%\System32\UIRibbonRes.dll = System32\UIRibbonRes.dll
%SystemRoot%\System32\en-US\UIRibbon.dll.mui = System32\en-US\UIRibbon.dll.mui
%SystemRoot%\SysWOW64\UIRibbon.dll = SysWOW64\UIRibbon.dll
%SystemRoot%\SysWOW64\UIRibbonRes.dll = SysWOW64\UIRibbonRes.dll
%SystemRoot%\SysWOW64\en-US\UIRibbon.dll.mui = SysWOW64\en-US\UIRibbon.dll.mui

[Files]
Requires = Files=1
%SystemRoot%\SystemResources\Shell32.dll.mun = resources\Shell32.dll.mun
%SystemRoot%\SystemResources\imageres.dll.mun = resources\imageres.dll.mun
